version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    # Override Gunicorn with Django development server for hot-reloading
    command: >
      sh -c "python manage.py migrate && 
             python manage.py seed_core_users && 
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - DEBUG=1

  frontend:
    # Use a raw node image instead of the Nginx production build
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Run the Vite dev server with host exposed for hot-reloading
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173" # Vite's default dev port
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
