<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Dashboard – SDCCE</title>
  <meta name="description" content="SDCCE Teacher Dashboard – manage your subjects, attendance, and timetable." />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <!-- React 18 + Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* ═══ CLAY MORPHISM DESIGN SYSTEM ═══ */
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ── Light clay palette ── */
      --clay-bg:        #f0e9ff;
      --clay-sidebar:   #ddd5f8;
      --clay-header:    #e4dcf6;
      --clay-chrome:    #c8b8f0;
      --clay-blue:      #7c6fff;
      --clay-blue-d:    #5a4de0;
      --clay-red:       #ff7070;
      --text-dark:      #3a2d5c;
      --text-mid:       #6b5c8a;
      --text-light:     #a090c0;
      --sidebar-w:      210px;
      --header-h:       60px;
      --chrome-h:       30px;
      --cs1: 6px 6px 0px rgba(124,111,255,0.35), inset 2px 2px 8px rgba(255,255,255,0.7),  inset -2px -2px 8px rgba(124,111,255,0.2);
      --cs2: 6px 6px 0px rgba(220,100,140,0.30), inset 2px 2px 8px rgba(255,255,255,0.75), inset -2px -2px 8px rgba(220,100,140,0.2);
      --cs3: 6px 6px 0px rgba(60,180,140,0.30),  inset 2px 2px 8px rgba(255,255,255,0.75), inset -2px -2px 8px rgba(60,180,140,0.2);
      --cs4: 6px 6px 0px rgba(210,150,60,0.30),  inset 2px 2px 8px rgba(255,255,255,0.75), inset -2px -2px 8px rgba(210,150,60,0.2);
      --clay-sm:  4px 4px 0px rgba(150,120,220,0.30), inset 1px 1px 4px rgba(255,255,255,0.65), inset -1px -1px 4px rgba(150,120,220,0.20);
      --clay-in:  inset 3px 3px 8px rgba(150,120,220,0.30), inset -2px -2px 6px rgba(255,255,255,0.60);
      --rx: 22px; --rl: 16px; --rm: 12px; --rs: 8px;
      --tr: 0.22s ease;

      /* ── Card face colours ── */
      --card1-bg: #ddd0ff;
      --card2-bg: #ffd6e4;
      --card3-bg: #c4f0e0;
      --card4-bg: #ffe8bc;

      /* ── Shared neutrals ── */
      --cell-bg:       rgba(255,255,255,0.55);
      --cell-empty-bg: rgba(255,255,255,0.25);
      --modal-bg:      #ede4ff;
      --input-bg:      rgba(255,255,255,0.6);
      --info-bg:       rgba(255,255,255,0.45);
      --welcome-bg:    rgba(255,255,255,0.55);
    }

    /* ════════════════════════════════════
       DARK MODE OVERRIDES
       ════════════════════════════════════ */
    .dark {
      --clay-bg:      #1a1530;
      --clay-sidebar: #211c3a;
      --clay-header:  #1e1835;
      --clay-chrome:  #17122c;
      --clay-blue:    #8a7fff;
      --clay-blue-d:  #6a5ff0;
      --clay-red:     #ff8080;
      --text-dark:    #e8e0ff;
      --text-mid:     #b0a0d8;
      --text-light:   #6a5c90;

      /* Dark clay card shadows — deeper offsets, no white inset */
      --cs1: 6px 6px 0px rgba(100,88,220,0.55), inset 2px 2px 8px rgba(180,160,255,0.12), inset -2px -2px 8px rgba(0,0,0,0.35);
      --cs2: 6px 6px 0px rgba(180,70,110,0.45),  inset 2px 2px 8px rgba(255,180,200,0.10), inset -2px -2px 8px rgba(0,0,0,0.35);
      --cs3: 6px 6px 0px rgba(30,140,100,0.45),  inset 2px 2px 8px rgba(160,240,200,0.10), inset -2px -2px 8px rgba(0,0,0,0.35);
      --cs4: 6px 6px 0px rgba(160,110,20,0.45),  inset 2px 2px 8px rgba(255,220,140,0.10), inset -2px -2px 8px rgba(0,0,0,0.35);
      --clay-sm: 4px 4px 0px rgba(0,0,0,0.40), inset 1px 1px 4px rgba(255,255,255,0.08), inset -1px -1px 4px rgba(0,0,0,0.30);
      --clay-in: inset 3px 3px 8px rgba(0,0,0,0.40), inset -2px -2px 6px rgba(255,255,255,0.05);

      /* Dark card faces */
      --card1-bg: #2e2655;
      --card2-bg: #3a2040;
      --card3-bg: #1a3030;
      --card4-bg: #352a18;

      /* Dark neutrals */
      --cell-bg:       rgba(255,255,255,0.06);
      --cell-empty-bg: rgba(255,255,255,0.03);
      --modal-bg:      #2a2248;
      --input-bg:      rgba(255,255,255,0.08);
      --info-bg:       rgba(255,255,255,0.06);
      --welcome-bg:    rgba(255,255,255,0.07);
    }

    /* Apply dark palette to html/body root when .dark is on wrapper */
    .dark, .dark html, .dark body { background: var(--clay-bg); color: var(--text-dark); }

    html, body, #root {
      height: 100%;
      font-family: 'Nunito', Arial, sans-serif;
      background: var(--clay-bg);
      color: var(--text-dark);
      overflow: hidden;
      font-size: 14px;
      transition: background var(--tr), color var(--tr);
    }

    /* Wrapper div that holds the dark class */
    .app-root {
      height: 100%; display: flex; flex-direction: column;
      background: var(--clay-bg); color: var(--text-dark);
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(150,120,220,0.2); border-radius: 4px; }

    /* ── Chrome Bar ── */
    .chrome-bar {
      height: var(--chrome-h);
      background: var(--clay-chrome);
      box-shadow: 0 2px 0 rgba(150,120,220,0.25), inset 0 1px 0 rgba(255,255,255,0.5);
      display: flex; align-items: center;
      padding: 0 16px;
      font-size: 12px; font-weight: 700;
      color: var(--text-mid); letter-spacing: 0.04em;
      user-select: none; flex-shrink: 0;
    }

    /* ── Shell ── */
    .app-shell {
      display: flex;
      height: calc(100vh - var(--chrome-h));
    }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w); min-width: var(--sidebar-w);
      background: var(--clay-sidebar);
      box-shadow: 4px 0 0 rgba(150,120,220,0.18), inset -2px 0 8px rgba(255,255,255,0.5);
      display: flex; flex-direction: column;
      justify-content: space-between;
      padding: 24px 0 18px;
      transition: width var(--tr), min-width var(--tr);
      overflow: hidden; flex-shrink: 0;
    }
    .sidebar.collapsed { width: 0; min-width: 0; padding: 0; box-shadow: none; }

    .sidebar-top { display: flex; flex-direction: column; gap: 22px; }

    .welcome-block {
      padding: 13px 14px; margin: 0 10px;
      background: var(--welcome-bg);
      border-radius: var(--rl);
      box-shadow: var(--clay-sm);
      display: flex; flex-direction: column; gap: 1px;
      transition: background var(--tr);
    }
    .welcome-label { font-size: 10px; color: var(--text-light); font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; }
    .welcome-role  { font-size: 11px; color: var(--text-mid); font-weight: 600; }
    .welcome-name  { font-size: 15px; color: var(--text-dark); font-weight: 900; margin-top: 2px; }

    .nav-links { display: flex; flex-direction: column; gap: 6px; padding: 0 10px; }

    .nav-item {
      display: flex; align-items: center; gap: 9px;
      padding: 10px 12px; border-radius: var(--rm);
      text-decoration: none; color: var(--text-mid);
      font-size: 13px; font-weight: 700;
      transition: all var(--tr); white-space: nowrap;
      cursor: pointer; border: none; background: transparent;
      width: 100%; text-align: left; font-family: 'Nunito', sans-serif;
    }
    .nav-item:hover {
      background: rgba(255,255,255,0.5); color: var(--text-dark);
      box-shadow: var(--clay-sm); transform: translateY(-1px);
    }
    .nav-item.active {
      background: var(--clay-blue); color: #fff;
      box-shadow: 4px 4px 0px rgba(90,77,224,0.45), inset 1px 1px 4px rgba(255,255,255,0.3), inset -1px -1px 4px rgba(90,77,224,0.3);
      transform: translateY(-1px);
    }
    .nav-item .msym { font-size: 19px; }

    .sidebar-bottom { padding: 0 10px; }
    .signout-btn {
      display: flex; align-items: center; gap: 9px;
      padding: 10px 12px; border-radius: var(--rm);
      border: none; background: rgba(255,112,112,0.14);
      color: var(--clay-red); font-size: 13px; font-weight: 700;
      cursor: pointer; width: 100%; transition: all var(--tr);
      white-space: nowrap; font-family: 'Nunito', sans-serif;
      box-shadow: var(--clay-sm);
    }
    .signout-btn:hover { background: rgba(255,112,112,0.26); transform: translateY(-1px); }

    /* ── Main Panel ── */
    .main-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--clay-bg); }

    .top-bar {
      height: var(--header-h); background: var(--clay-header);
      box-shadow: 0 4px 0 rgba(150,120,220,0.16), inset 0 2px 0 rgba(255,255,255,0.6);
      display: flex; align-items: center; gap: 14px;
      padding: 0 20px; flex-shrink: 0;
    }
    .hamburger {
      background: rgba(255,255,255,0.55); border: none; color: var(--text-dark);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      padding: 6px; border-radius: var(--rs); transition: all var(--tr);
      box-shadow: var(--clay-sm);
    }
    .hamburger:hover { background: rgba(255,255,255,0.85); transform: translateY(-1px); }
    .hamburger .msym { font-size: 22px; }

    .brand {
      font-size: 20px; font-weight: 900; color: var(--clay-blue);
      letter-spacing: 0.08em; text-shadow: 2px 2px 0 rgba(124,111,255,0.18);
      flex: 1;
    }

    /* ── Dark / Light mode toggle button ── */
    .theme-toggle {
      display: flex; align-items: center; gap: 7px;
      padding: 7px 14px; border-radius: 50px;
      border: none; cursor: pointer;
      font-size: 12px; font-weight: 800; font-family: 'Nunito', sans-serif;
      color: var(--text-dark);
      background: var(--welcome-bg);
      box-shadow: var(--clay-sm);
      transition: all var(--tr); white-space: nowrap;
    }
    .theme-toggle:hover { transform: translateY(-2px); background: var(--cell-bg); }
    .theme-toggle:active { transform: translateY(0); }
    .theme-toggle .msym { font-size: 18px; transition: transform 0.4s ease; }
    .theme-toggle:hover .msym { transform: rotate(20deg); }

    /* ── Content ── */
    .content {
      flex: 1; overflow-y: auto;
      padding: 24px 24px 80px; position: relative;
    }
    .page-title {
      font-size: 22px; font-weight: 900; color: var(--text-dark);
      margin-bottom: 20px; text-shadow: 2px 2px 0 rgba(150,120,220,0.12);
    }

    /* ═══════════ SUBJECT CARDS ═══════════ */
    .subjects-list { display: flex; flex-direction: column; gap: 16px; }

    .subject-card {
      border-radius: var(--rx); padding: 18px 20px 20px; position: relative;
      transition: transform var(--tr), box-shadow var(--tr), background 0.3s ease;
      animation: cardIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
      border: none;
    }
    .subject-card:nth-child(4n+1) { background: var(--card1-bg); box-shadow: var(--cs1); }
    .subject-card:nth-child(4n+2) { background: var(--card2-bg); box-shadow: var(--cs2); }
    .subject-card:nth-child(4n+3) { background: var(--card3-bg); box-shadow: var(--cs3); }
    .subject-card:nth-child(4n+4) { background: var(--card4-bg); box-shadow: var(--cs4); }

    .subject-card:hover { transform: translateY(-4px) translateX(-2px); }
    .subject-card:nth-child(4n+1):hover { box-shadow: 9px 9px 0px rgba(124,111,255,0.4), inset 2px 2px 8px rgba(255,255,255,0.75), inset -2px -2px 8px rgba(124,111,255,0.22); }
    .subject-card:nth-child(4n+2):hover { box-shadow: 9px 9px 0px rgba(220,100,140,0.38), inset 2px 2px 8px rgba(255,255,255,0.8), inset -2px -2px 8px rgba(220,100,140,0.22); }
    .subject-card:nth-child(4n+3):hover { box-shadow: 9px 9px 0px rgba(60,180,140,0.38), inset 2px 2px 8px rgba(255,255,255,0.8), inset -2px -2px 8px rgba(60,180,140,0.22); }
    .subject-card:nth-child(4n+4):hover { box-shadow: 9px 9px 0px rgba(210,150,60,0.38), inset 2px 2px 8px rgba(255,255,255,0.8), inset -2px -2px 8px rgba(210,150,60,0.22); }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(22px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card-class {
      font-size: 10.5px; font-weight: 800; color: var(--text-mid);
      margin-bottom: 3px; padding-right: 34px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .card-subject { font-size: 15px; font-weight: 900; color: var(--text-dark); margin-bottom: 3px; }
    .card-students { font-size: 12px; color: var(--text-mid); font-weight: 600; margin-bottom: 14px; }

    .card-info-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .info-block {
      display: flex; flex-direction: column; gap: 2px;
      background: var(--info-bg); border-radius: var(--rs);
      padding: 7px 11px;
      box-shadow: inset 2px 2px 5px rgba(255,255,255,0.65), inset -1px -1px 4px rgba(0,0,0,0.08);
      flex: 1; min-width: 110px;
      transition: background 0.3s ease;
    }
    .info-label { font-size: 9px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
    .info-label.green  { color: #2eaa6e; }
    .info-label.orange { color: #c86a10; }
    .info-value { font-size: 12.5px; font-weight: 700; color: var(--text-dark); }

    .progress-track {
      height: 7px; background: rgba(255,255,255,0.4);
      border-radius: 99px; overflow: hidden; margin-top: 3px;
      box-shadow: inset 2px 2px 4px rgba(0,0,0,0.09), inset -1px -1px 3px rgba(255,255,255,0.6);
    }
    .progress-fill { height: 100%; border-radius: 99px; transition: width 0.9s cubic-bezier(0.4,0,0.2,1); }
    .progress-fill.good { background: linear-gradient(90deg,#4ccea0,#80e8c0); }
    .progress-fill.poor { background: linear-gradient(90deg,#ff7070,#ffaa88); }

    .edit-btn {
      position: absolute; top: 14px; right: 14px;
      background: rgba(255,255,255,0.55); border: none; color: var(--text-mid);
      cursor: pointer; padding: 6px; border-radius: var(--rs);
      transition: all var(--tr); display: flex; align-items: center;
      box-shadow: var(--clay-sm);
    }
    .edit-btn:hover { background: rgba(255,255,255,0.88); color: var(--clay-blue); transform: translateY(-1px); }
    .edit-btn .msym { font-size: 17px; }

    /* ── FAB ── */
    .fab {
      position: fixed; bottom: 28px; right: 28px;
      width: 54px; height: 54px; border-radius: 50%;
      background: var(--clay-blue); border: none; color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 6px 6px 0px rgba(90,77,224,0.45), inset 2px 2px 6px rgba(255,255,255,0.35), inset -2px -2px 6px rgba(90,77,224,0.35);
      transition: all var(--tr); z-index: 100;
    }
    .fab:hover {
      background: var(--clay-blue-d);
      transform: scale(1.1) rotate(90deg) translateY(-2px);
      box-shadow: 8px 8px 0px rgba(90,77,224,0.5), inset 2px 2px 6px rgba(255,255,255,0.4), inset -2px -2px 6px rgba(90,77,224,0.4);
    }
    .fab:active { transform: scale(0.95) rotate(90deg); }
    .fab .msym { font-size: 28px; font-variation-settings: 'wght' 300; }

    /* ── Empty State ── */
    .empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 10px; padding: 56px 20px;
      color: var(--text-light);
      background: rgba(255,255,255,0.35); border-radius: var(--rx);
      box-shadow: var(--clay-in); margin-top: 6px;
    }
    .empty-state .msym { font-size: 50px; color: var(--text-light); }
    .empty-state p { font-size: 13px; font-weight: 700; }
    .empty-state strong { color: var(--clay-blue); }

    /* ═══════════ MODAL ═══════════ */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(180,160,240,0.35);
      display: flex; align-items: center; justify-content: center;
      z-index: 300; backdrop-filter: blur(8px);
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      background: var(--modal-bg); border-radius: 22px;
      padding: 28px 26px 24px; width: 100%; max-width: 430px;
      box-shadow: 10px 10px 0px rgba(124,111,255,0.35), inset 3px 3px 10px rgba(255,255,255,0.75), inset -3px -3px 10px rgba(124,111,255,0.2);
      animation: modalIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.85) translateY(22px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-title { font-size: 18px; font-weight: 900; color: var(--text-dark); margin-bottom: 20px; }

    .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .form-group label { font-size: 10.5px; font-weight: 800; color: var(--text-mid); letter-spacing: 0.05em; text-transform: uppercase; }
    .form-group input {
      background: var(--input-bg); border: none;
      border-radius: var(--rm); padding: 9px 12px;
      color: var(--text-dark); font-size: 13px; font-weight: 700;
      font-family: 'Nunito', sans-serif; outline: none;
      transition: all var(--tr);
      box-shadow: inset 3px 3px 7px rgba(150,120,220,0.2), inset -2px -2px 6px rgba(255,255,255,0.7);
    }
    .form-group input:focus {
      background: rgba(255,255,255,0.88);
      box-shadow: inset 3px 3px 7px rgba(124,111,255,0.25), inset -2px -2px 6px rgba(255,255,255,0.8), 0 0 0 2px rgba(124,111,255,0.25);
    }
    .form-group input::placeholder { color: var(--text-light); font-weight: 600; }

    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
    .btn-cancel {
      padding: 9px 18px; border-radius: var(--rm); border: none;
      background: rgba(255,255,255,0.55); color: var(--text-mid);
      font-size: 13px; font-family: 'Nunito', sans-serif; font-weight: 700;
      cursor: pointer; transition: all var(--tr); box-shadow: var(--clay-sm);
    }
    .btn-cancel:hover { background: rgba(255,255,255,0.85); transform: translateY(-2px); }
    .btn-save {
      padding: 9px 20px; border-radius: var(--rm); border: none;
      background: var(--clay-blue); color: #fff;
      font-size: 13px; font-family: 'Nunito', sans-serif; font-weight: 800;
      cursor: pointer; transition: all var(--tr);
      box-shadow: 4px 4px 0px rgba(90,77,224,0.4), inset 1px 1px 4px rgba(255,255,255,0.3), inset -1px -1px 4px rgba(90,77,224,0.3);
    }
    .btn-save:hover { background: var(--clay-blue-d); transform: translateY(-2px); }
    .btn-save:active { transform: translateY(1px); }

    /* ═══════════ TIMETABLE ═══════════ */
    .tt-content { padding: 20px 20px 60px; overflow-y: auto; flex: 1; }

    .class-section {
      margin-bottom: 28px;
      border-radius: var(--rx); padding: 18px;
    }
    .class-section:nth-child(1) { background: var(--card1-bg); box-shadow: var(--cs1); }
    .class-section:nth-child(2) { background: var(--card2-bg); box-shadow: var(--cs2); }
    .class-section:nth-child(3) { background: var(--card3-bg); box-shadow: var(--cs3); }
    .class-section:nth-child(4) { background: var(--card4-bg); box-shadow: var(--cs4); }

    .class-header {
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
      margin-bottom: 14px;
    }
    .class-title {
      font-size: 14px; font-weight: 900; color: var(--text-dark);
      background: rgba(255,255,255,0.55);
      padding: 5px 12px; border-radius: 20px;
      box-shadow: var(--clay-sm);
    }
    .class-subject-badge {
      font-size: 12px; font-weight: 700; color: var(--text-mid);
      background: rgba(255,255,255,0.4);
      padding: 4px 10px; border-radius: 20px;
    }
    .mentor-badge {
      font-size: 11px; font-weight: 700; color: var(--text-mid);
      background: rgba(255,255,255,0.35);
      padding: 4px 10px; border-radius: 20px; margin-left: auto;
    }

    .tt-table-wrap { overflow-x: auto; border-radius: var(--rm); }
    .tt-table {
      width: 100%; border-collapse: separate; border-spacing: 4px;

    .notice-compose {

    /* ═══════════════════════════════════════════
       UTILITIES
    ═══════════════════════════════════════════ */
    function formatDate(iso) {
      if (!iso) return '—';
      const [y, m, d] = iso.split('-');
      return `${d}/${m}/${y}`;
    }
    function loadSubjects() {
      try {
        const s = localStorage.getItem('sdcce_subjects');
        return s ? JSON.parse(s) : [...DEFAULT_SUBJECTS];
      } catch { return [...DEFAULT_SUBJECTS]; }
    }
    function saveSubjectsLS(data) {
      localStorage.setItem('sdcce_subjects', JSON.stringify(data));
    }

    /* ═══════════════════════════════════════════
       TOAST
    ═══════════════════════════════════════════ */
    function Toast({ message }) {
      if (!message) return null;
      return <div className="toast">{message}</div>;
    }

    function SubjectModal({ title, data, onChange, onSave, onCancel }) {

            </div>
            <div className="form-group">
              <label>Subject Name</label>
              <input type="text" placeholder="e.g. Software Engineering"
                value={data.subjectName} onChange={e => onChange('subjectName', e.target.value)} />
            </div>
            <div className="form-group">
              <label>Total Students</label>
              <input type="number" placeholder="e.g. 25"
                value={data.totalStudents} onChange={e => onChange('totalStudents', e.target.value)} />

    /* ═══════════════════════════════════════════
       DASHBOARD
    ═══════════════════════════════════════════ */
    function Dashboard({ showToast }) {
      const [subjects, setSubjects] = useState(loadSubjects);
      const [addOpen, setAddOpen]   = useState(false);
      const [editIdx, setEditIdx]   = useState(null);

      const blankForm = { className:'', subjectName:'', totalStudents:'', attendance:'', nextLecture:'' };
      const [addForm,  setAddForm]  = useState(blankForm);
      const [editForm, setEditForm] = useState(blankForm);

      function persist(data) { setSubjects(data); saveSubjectsLS(data); }

      function handleSave() {
        const { className, subjectName, totalStudents, attendance, nextLecture } = addForm;
        if (!className||!subjectName||!totalStudents||!attendance||!nextLecture) {
          showToast('⚠️ Please fill in all fields.'); return;
        }
        persist([...subjects, { className, subjectName,
          totalStudents: parseInt(totalStudents),
          attendance: parseFloat(attendance), nextLecture }]);
        setAddOpen(false); setAddForm(blankForm);
        showToast('✅ Subject added!');
      }

      function handleUpdate() {
        const { className, subjectName, totalStudents, attendance, nextLecture } = editForm;
        if (!className||!subjectName||!totalStudents||!attendance||!nextLecture) {
          showToast('⚠️ Please fill in all fields.'); return;
        }
        const updated = [...subjects];
        updated[editIdx] = { className, subjectName,
          totalStudents: parseInt(totalStudents),
          attendance: parseFloat(attendance), nextLecture };
        persist(updated); setEditIdx(null);
        showToast('✅ Subject updated!');
      }

      function openEdit(i) {
        const s = subjects[i];
        setEditForm({ className: s.className, subjectName: s.subjectName,
          totalStudents: String(s.totalStudents), attendance: String(s.attendance),
          nextLecture: s.nextLecture });
        setEditIdx(i);
      }

      return (
        <div className="content" style={{position:'relative'}}>
          <h2 className="page-title">My Subjects</h2>

          {subjects.length === 0 ? (
            <div className="empty-state">
              <span className="msym material-symbols-rounded">menu_book</span>
              <p>No subjects yet. Tap <strong>+</strong> to add one.</p>
            </div>
          ) : (
            <div className="subjects-list">
              {subjects.map((s, i) => {
                const pct = Math.min(Math.max(s.attendance, 0), 100);
                const good = pct >= 75;
                return (
                  <div key={i} className="subject-card"
                    style={{ animationDelay: `${i * 0.07}s` }}>
                    <button className="edit-btn" onClick={() => openEdit(i)}>
                      <span className="msym material-symbols-rounded">edit_square</span>
                    </button>
                    <div className="card-class">{s.className}</div>
                    <div className="card-subject">{s.subjectName}</div>
                    <div className="card-students">Total Students: {s.totalStudents}</div>
                    <div className="card-info-row">
                      <div className="info-block">
                        <span className="info-label green">Avg Attendance</span>
                        <span className="info-value">{pct.toFixed(2)}% / 100%</span>
                        <div className="progress-track">
                          <ProgressBar pct={pct} good={good} />
                        </div>
                      </div>
                      <div className="info-block">
                        <span className="info-label orange">Upcoming Lecture</span>
                        <span className="info-value">{formatDate(s.nextLecture)}</span>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          <button className="fab" onClick={() => { setAddForm(blankForm); setAddOpen(true); }}
            aria-label="Add Subject">
            <span className="msym material-symbols-rounded">add</span>
          </button>

          {addOpen && (
            <SubjectModal title="Add New Subject" data={addForm}
              onChange={(k,v) => setAddForm(f => ({...f,[k]:v}))}
              onSave={handleSave} onCancel={() => setAddOpen(false)} />
          )}
          {editIdx !== null && (
            <SubjectModal title="Edit Subject" data={editForm}
              onChange={(k,v) => setEditForm(f => ({...f,[k]:v}))}
              onSave={handleUpdate} onCancel={() => setEditIdx(null)} />
          )}
        </div>
      );
    }

    /* Animated progress bar (uses effect for animation) */
    function ProgressBar({ pct, good }) {
      const [width, setWidth] = useState(0);
      useEffect(() => {
        const t = setTimeout(() => setWidth(pct), 80);
        return () => clearTimeout(t);
      }, [pct]);
      return (
        <div className={`progress-fill ${good ? 'good' : 'poor'}`}
          style={{ width: `${width}%` }} />
      );
    }

        const m = {};

        return m;
      });

      useEffect(() => {
        const m = {};
        STUDENTS_DATA.filter(s => s.class === selClass).forEach(s => { m[s.roll] = 'Present'; });
        setAttMap(m);
      }, [selClass]);

      function toggle(roll, val) {
        setAttMap(m => ({ ...m, [roll]: val }));
      }

      const presentCount = Object.values(attMap).filter(v => v === 'Present').length;
      const absentCount  = Object.values(attMap).filter(v => v === 'Absent').length;

      function handleSave() {
        showToast(`✅ Attendance saved for ${selClass} — ${presentCount} present, ${absentCount} absent`);

      return (
        <div className="page-content">
          <h2 className="page-title">Mark Attendance</h2>

          <div className="att-class-select">
            {classes.map(c => (
              <button key={c} className={`att-class-btn${selClass===c?' active':''}`}
                onClick={() => setSelClass(c)}>{c}</button>
            ))}
          </div>

          <div className="att-date-row">
            <span className="att-date-label">Date:</span>
            <input type="date" value={date} onChange={e => setDate(e.target.value)} />
          </div>

          <div className="att-summary">
            <span>Class: <strong>{selClass}</strong></span>
            <span>Present: <strong style={{color:'#2eaa6e'}}>{presentCount}</strong></span>
            <span>Absent: <strong style={{color:'#e04444'}}>{absentCount}</strong></span>
            <span>Total: <strong>{classStudents.length}</strong></span>
          </div>

          <table className="att-table">
            <thead>
              <tr>
                <th>Roll</th>
                <th>Name</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              {classStudents.map((s,i) => (
                <tr key={i} className={`att-row ${attMap[s.roll]==='Present'?'present':'absent'}`}>
                  <td style={{fontWeight:700,color:'var(--text-mid)'}}>{s.roll}</td>
                  <td style={{fontWeight:800}}>{s.name}</td>
                  <td>
                    <div className="att-toggle">
                      <button className={`p-btn${attMap[s.roll]==='Present'?' sel':''}`}
                        onClick={() => toggle(s.roll,'Present')}>P</button>
                      <button className={`a-btn${attMap[s.roll]==='Absent'?' sel':''}`}
                        onClick={() => toggle(s.roll,'Absent')}>A</button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>

          <button className="att-save-btn" onClick={handleSave}>
            <span className="msym material-symbols-rounded" style={{fontSize:16,verticalAlign:'middle',marginRight:6}}>save</span>
            Save Attendance
          </button>
        </div>
      );
    }

    /* ═══════════════════════════════════════════
       NOTICES PAGE
    ═══════════════════════════════════════════ */
    const INIT_NOTICES = [
      { id:1, tag:'urgent',   title:'Mid-Sem Exam Schedule', body:'Mid-semester examinations will be held from 25th August. All students must carry their ID cards.', date:'19 Aug 2026', by:'HOD' },
      { id:2, tag:'academic', title:'Assignment Submission', body:'Final project submissions for T.Y B.Voc are due by 22nd August. Late submissions will not be accepted.', date:'18 Aug 2026', by:'Prof. Monica' },
      { id:3, tag:'event',    title:'Annual Tech Fest',       body:'SDCCE Annual Tech Fest is scheduled for 5th September. Registrations open now!', date:'17 Aug 2026', by:'Admin' },
      { id:4, tag:'general',  title:'Library Holiday Notice', body:'College library will remain closed on 21st August due to annual stock taking.', date:'16 Aug 2026', by:'Librarian' },
    ];

    function Notices({ showToast }) {
      const [notices, setNotices] = useState(INIT_NOTICES);
      const [title, setTitle]   = useState('');
      const [body,  setBody]    = useState('');
      const [tag,   setTag]     = useState('general');

      function post() {
        if (!title.trim() || !body.trim()) { showToast('⚠️ Please fill in title and message.'); return; }
        const now = new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
        setNotices(n => [{ id: Date.now(), tag, title, body, date: now, by: 'Prof. Monica' }, ...n]);
        setTitle(''); setBody('');
        showToast('📢 Notice posted!');
      }

      function del(id) {
        setNotices(n => n.filter(x => x.id !== id));
        showToast('🗑️ Notice deleted.');
      }

      return (
        <div className="page-content">
          <h2 className="page-title">Notices & Announcements</h2>

          {/* Compose */}
          <div className="notice-compose">
            <div className="notice-header-row" style={{marginBottom:10}}>
              <input type="text" placeholder="Notice title…"
                value={title} onChange={e => setTitle(e.target.value)} />
              <select value={tag} onChange={e => setTag(e.target.value)}>
                <option value="general">General</option>
                <option value="urgent">Urgent</option>
                <option value="academic">Academic</option>
                <option value="event">Event</option>
              </select>
              <button className="notice-post-btn" onClick={post}>
                <span className="msym material-symbols-rounded" style={{fontSize:14,verticalAlign:'middle',marginRight:4}}>send</span>
                Post
              </button>
            </div>
            <textarea placeholder="Write your announcement here…"
              value={body} onChange={e => setBody(e.target.value)} />
          </div>

          {/* List */}
          <p className="section-title">Posted Notices</p>
          <div className="notice-list">
            {notices.map(n => (
              <div key={n.id} className="notice-item">
                <span className={`notice-tag ${n.tag}`}>{n.tag}</span>
                <div className="notice-title">{n.title}</div>
                <div className="notice-body">{n.body}</div>
                <div className="notice-meta">{n.date} · by {n.by}</div>
                <button className="notice-del" onClick={() => del(n.id)}>
                  <span className="msym material-symbols-rounded" style={{fontSize:14}}>delete</span>
                </button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════
       REPORTS PAGE
    ═══════════════════════════════════════════ */
    function Reports() {
      const subjects = JSON.parse(localStorage.getItem('sdcce_subjects') || '[]');
      const allSubjects = subjects.length ? subjects : [
        { subjectName:'Software Eng', attendance:82.67, totalStudents:25 },
        { subjectName:'Data Structures', attendance:57.25, totalStudents:30 },
        { subjectName:'AI & ML',  attendance:91.00, totalStudents:22 },
        { subjectName:'Web Tech', attendance:68.40, totalStudents:25 },
      ];

      const [bars, setBars] = useState(false);
      useEffect(() => { setTimeout(() => setBars(true), 120); }, []);

      function barClass(p) { return p >= 75 ? 'good' : p >= 65 ? 'warn' : 'crit'; }

      const totalStudents = allSubjects.reduce((a,s) => a + (s.totalStudents||0), 0);
      const avgAtt = allSubjects.reduce((a,s) => a + s.attendance, 0) / allSubjects.length;
      const critCount = allSubjects.filter(s => s.attendance < 65).length;
      const goodCount = allSubjects.filter(s => s.attendance >= 75).length;
      const warnCount = allSubjects.length - critCount - goodCount;

      /* Donut */
      const gPct = Math.round(goodCount/allSubjects.length*100);
      const wPct = Math.round(warnCount/allSubjects.length*100);
      const cPct = 100 - gPct - wPct;
      const donutBg = `conic-gradient(#4ccea0 0% ${gPct}%, #ffaa55 ${gPct}% ${gPct+wPct}%, #ff7070 ${gPct+wPct}% 100%)`;

      return (
        <div className="page-content">
          <h2 className="page-title">Reports & Analytics</h2>

          {/* Summary stats */}
          <div className="stat-strip">
            <div className="stat-card">
              <span className="stat-val">{totalStudents}</span>
              <span className="stat-lbl">Total Students</span>
            </div>
            <div className="stat-card">
              <span className="stat-val">{avgAtt.toFixed(1)}%</span>
              <span className="stat-lbl">Avg Attendance</span>
            </div>
            <div className="stat-card">
              <span className="stat-val">{allSubjects.length}</span>
              <span className="stat-lbl">Active Subjects</span>
            </div>
            <div className="stat-card">
              <span className="stat-val">{critCount}</span>
              <span className="stat-lbl">Critical Subjects</span>
            </div>
          </div>

          <div className="report-grid">
            {/* Bar chart */}
            <div className="report-card">
              <div className="report-card-title">Attendance by Subject</div>
              <div className="bar-chart">
                {allSubjects.map((s,i) => {
                  const pct = Math.min(Math.max(s.attendance,0),100);
                  return (
                    <div key={i} className="bar-row">
                      <span className="bar-label">{s.subjectName}</span>
                      <div className="bar-track">
                        <div className={`bar-fill ${barClass(pct)}`}
                          style={{ width: bars ? `${pct}%` : '0%' }} />
                      </div>
                      <span className="bar-val">{pct.toFixed(0)}%</span>
                    </div>
                  );
                })}
              </div>
            </div>

            {/* Donut */}
            <div className="report-card">
              <div className="report-card-title">Health Distribution</div>
              <div className="donut-wrap">
                <div className="donut" style={{ background: donutBg }}>
                  <div style={{
                    width:54, height:54, borderRadius:'50%',
                    background:'var(--card2-bg)',
                    display:'flex', alignItems:'center', justifyContent:'center',
                    fontSize:13, fontWeight:900, color:'var(--text-dark)'
                  }}>{gPct}%</div>
                </div>
                <div className="donut-legend">
                  <div className="legend-row"><div className="legend-dot" style={{background:'#4ccea0'}} /> Healthy ({goodCount})</div>
                  <div className="legend-row"><div className="legend-dot" style={{background:'#ffaa55'}} /> Warning ({warnCount})</div>
                  <div className="legend-row"><div className="legend-dot" style={{background:'#ff7070'}} /> Critical ({critCount})</div>
                </div>
              </div>
            </div>

            {/* Student count */}
            <div className="report-card">
              <div className="report-card-title">Students per Subject</div>
              <div className="bar-chart">
                {allSubjects.map((s,i) => (
                  <div key={i} className="bar-row">
                    <span className="bar-label">{s.subjectName}</span>
                    <div className="bar-track">
                      <div className={`bar-fill ${barClass(s.attendance)}`}
                        style={{ width: bars ? `${Math.min((s.totalStudents||0)/40*100,100)}%` : '0%' }} />
                    </div>
                    <span className="bar-val">{s.totalStudents||'—'}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Weekly trend (mock) */}
            <div className="report-card">
              <div className="report-card-title">Weekly Attendance Trend</div>
              <div className="bar-chart">
                {[['Mon',78],['Tue',82],['Wed',74],['Thu',89],['Fri',71],['Sat',65]].map(([d,v],i) => (
                  <div key={i} className="bar-row">
                    <span className="bar-label">{d}</span>
                    <div className="bar-track">
                      <div className={`bar-fill ${barClass(v)}`}
                        style={{ width: bars ? `${v}%` : '0%' }} />
                    </div>
                    <span className="bar-val">{v}%</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ═══════════════════════════════════════════
       SIDEBAR
    ═══════════════════════════════════════════ */
    function Sidebar({ page, setPage, collapsed, showToast }) {
      return (
        <aside className={`sidebar${collapsed ? ' collapsed' : ''}`}>
          <div className="sidebar-top">
            <div className="welcome-block">
              <span className="welcome-label">Welcome,</span>
              <span className="welcome-role">Teacher</span>
              <span className="welcome-name">Monica</span>
            </div>
            <nav className="nav-links">
              {[
                { id:'dashboard',  icon:'dashboard',      label:'Dashboard'    },
                { id:'timetable',  icon:'calendar_month', label:'TimeTable'    },
                { id:'monitoring', icon:'monitor_heart',  label:'Monitoring'   },
                { id:'students',   icon:'group',          label:'Students'     },
                { id:'attendance', icon:'fact_check',     label:'Attendance'   },
                { id:'notices',    icon:'campaign',       label:'Notices'      },
                { id:'reports',    icon:'bar_chart',      label:'Reports'      },
              ].map(({ id, icon, label }) => (
                <button key={id}
                  className={`nav-item${page===id?' active':''}`}
                  onClick={() => setPage(id)}>
                  <span className="msym material-symbols-rounded">{icon}</span>
                  {label}
                </button>
              ))}
            </nav>
          </div>
          <div className="sidebar-bottom">
            <button className="signout-btn" onClick={() => showToast('👋 Signed out.')}>
              <span className="msym material-symbols-rounded">logout</span>
              Sign Out
            </button>
          </div>
        </aside>
      );
    }

    /* ═══════════════════════════════════════════
       APP ROOT
    ═══════════════════════════════════════════ */
    function App() {
      const [page,      setPage]      = useState('dashboard');
      const [collapsed, setCollapsed] = useState(false);
      const [toast,     setToast]     = useState('');
      const [dark,      setDark]      = useState(() => localStorage.getItem('sdcce_dark') === 'true');
      const toastTimer = useRef(null);

      function showToast(msg) {
        setToast(msg);
        clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(''), 2600);
      }

      function toggleDark() {
        setDark(d => {
          const next = !d;
          localStorage.setItem('sdcce_dark', String(next));
          return next;
        });
      }

      return (
        <div className={`app-root${dark ? ' dark' : ''}`}>
          {/* Chrome bar */}
          <div className="chrome-bar">Teacher Dashboard</div>

          <div className="app-shell">
            <Sidebar page={page} setPage={setPage}
              collapsed={collapsed} showToast={showToast} />

            <div className="main-panel">
              {/* Top bar */}
              <header className="top-bar">
                <button className="hamburger"
                  onClick={() => setCollapsed(c => !c)}
                  aria-label="Toggle Sidebar">
                  <span className="msym material-symbols-rounded">menu</span>
                </button>
                <h1 className="brand">SDCCE</h1>

                {/* Dark / Light toggle */}
                <button className="theme-toggle" onClick={toggleDark}
                  aria-label={dark ? 'Switch to light mode' : 'Switch to dark mode'}
                  title={dark ? 'Light mode' : 'Dark mode'}>
                  <span className="msym material-symbols-rounded">
                    {dark ? 'light_mode' : 'dark_mode'}
                  </span>
                  {dark ? 'Light' : 'Dark'}
                </button>
              </header>

              {/* Pages */}
              {page === 'dashboard'  && <Dashboard  showToast={showToast} />}
              {page === 'timetable'  && <Timetable />}
              {page === 'monitoring' && <Monitoring />}
              {page === 'students'   && <Students />}
              {page === 'attendance' && <AttendancePage showToast={showToast} />}
              {page === 'notices'    && <Notices showToast={showToast} />}
              {page === 'reports'    && <Reports />}
            </div>
          </div>

          {/* Toast */}
          {toast && <Toast message={toast} />}
        </div>
      );
    }

    /* Mount */
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
